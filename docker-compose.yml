services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
    depends_on:
      db:
        condition: service_healthy

  chat:
    build: .
    command: php /var/www/chat/chat_server.php start
    ports:
      - "8282:8282"
    volumes:
      - ./src:/var/www
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_info
    volumes:
      - db_data:/var/lib/mysql
      - ./dataTable.sql:/docker-entrypoint-initdb.d/dataTable.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s


volumes:
  db_data:
